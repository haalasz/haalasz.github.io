title: "Zsolt Halász"
description: "Computational Biology, Bioinformatics & Data Integrity"
baseurl: "haalasz.github.io"
url: "https://haalasz.github.io"

# site settings
taglong: Computational Biology, Bioinformatics & Data Integrity
#taglong2:
#tagshort: 

# author settings
author:
  name: Zsolt Halász
  email: halasz.zsolt@etk.unideb.hu
photo: "/assets/images/profile.webp"

# profile links
profile:
  instagram: https://www.instagram.com/zsolthalasz
  github: https://github.com/haalasz

exclude:
  - demo/
  - cvless.gemspec
  - LICENSE
  - README.md
  - screenshot.png

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate-v2
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed
  sourcemap: never

feed:
  path: atom.xml

autopages:
  enabled: false

pagination:
  enabled: true
  per_page: 1
  sort_reverse: true
  permalink: /:num/
  title: ":title &middot; Page :num"

collections:
  projects:
    output: false